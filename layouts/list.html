{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ .Content }}
{{- range .RegularPages.GroupByDate "2006" }}
<section class="year">
  <h2>{{ .Key }}</h2>
  <ol class="archive">
    {{- range .Pages }}
    <li>
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date | time.Format "Jan 02" }}</time>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    </li>
    {{- end }}
  </ol>
</section>
{{- end }}
{{ end }}
