# Builds the site with Hugo and publishes it to GitHub Pages.
# In the repo settings, set Pages > Build and deployment > Source to "GitHub Actions".
# Actions are pinned to commit SHAs; the comment after each is its release tag.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.170.1
  # SHA-256 of hugo_${HUGO_VERSION}_linux-amd64.tar.gz, from the release's checksums file.
  HUGO_SHA256: 841a5462853aefc9942e4de1e8a5d75584b6a5181941e6ad3f1d745190e03cd8

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install Hugo
        run: |
          tarball="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          cd "${{ runner.temp }}"
          wget -q "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${tarball}"
          echo "${HUGO_SHA256}  ${tarball}" | sha256sum -c -
          mkdir hugo && tar -xzf "${tarball}" -C hugo
          echo "${{ runner.temp }}/hugo" >> "$GITHUB_PATH"
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        env:
          HUGO_ENVIRONMENT: production
          TZ: America/Los_Angeles
        run: hugo --gc --minify --baseURL "https://turtlesdown.dev/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
